# Version-update PRs are kept infrequent and few to limit CI usage.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: "/apps/resolver"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
