name: hosting-ranges

# Weekly refresh of apps/resolver/data/hosting-ranges.json from the cloud
# providers' and crawlers' own published lists. When any prefix changed, it
# opens a pull request for review; it never merges and never deploys. It runs
# only on its schedule or by hand, never on pull requests or pushes.
#
# Opening the pull request needs Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests". A pull request opened with the
# workflow token does not start the ci workflow by itself: this job runs the
# public-safety gate and the ranges tests before opening it, and the full ci
# workflow can be run on the branch from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-ranges
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh published ranges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Download the published lists and regenerate the file
        run: node apps/resolver/scripts/update-hosting-ranges.mjs
      - name: Did any prefix change?
        id: diff
        run: |
          if git diff --quiet -- apps/resolver/data/hosting-ranges.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No prefix changed; nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the new file (public-safety gate, loader and generator tests)
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/check-public-safety.mjs
          npm ci --ignore-scripts
          npm run test --workspace @idr/resolver -- test/unit/hosting-ranges.test.ts
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="hosting-ranges/refresh-$(date -u +%Y-%m-%d)"
          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A pull request for $branch is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/resolver/data/hosting-ranges.json
          git commit -m "Refresh published cloud and crawler ranges" -m "Generated by apps/resolver/scripts/update-hosting-ranges.mjs from the providers' own lists."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          {
            echo "Weekly refresh of \`apps/resolver/data/hosting-ranges.json\`, generated by \`apps/resolver/scripts/update-hosting-ranges.mjs\` from each provider's published list."
            echo
            echo "Before opening this, the job ran the public-safety gate and the ranges tests. Run the full \`ci\` workflow on this branch from the Actions tab before merging."
            echo
            echo "Merging changes nothing until the resolver is redeployed. Review the diff: large removals or additions should match a provider announcement."
          } > /tmp/pr-body.md
          gh pr create --draft --base main --head "$branch" --title "Refresh published cloud and crawler ranges ($(date -u +%Y-%m-%d))" --body-file /tmp/pr-body.md
