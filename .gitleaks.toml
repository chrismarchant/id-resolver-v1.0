# gitleaks configuration for this PUBLIC repository (CHR-69, owner decision D8).
# Default ruleset plus a narrow allowlist of deliberately synthetic test values.
# Allowlist entries match the exact secret value, never a whole file or path, so
# a real credential added to a test file is still reported.
title = "id-resolver-v1"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test-only values (not credentials)"
regexTarget = "secret"
regexes = [
  '''^(0123456789abcdef)+$''',
  '''^sk_test_placeholder$''',
]

# Supabase identifiers and credentials (three-database separation,
# docs/GUARDRAILS.md G1), mirrored from scripts/check-public-safety.mjs so the
# secret scan reports them too. A JWT (including a service_role key) is already
# reported by the default `jwt` rule. The one allow-listed value is the
# synthetic stand-in project ref used by docs/staging/acceptance/self-test.mjs.
[[rules]]
id = "supabase-project-host"
description = "Concrete Supabase project host (<20-character ref>.supabase.co or .supabase.in)"
regex = '''(?i)\b([a-z0-9]{20})\.supabase\.(?:co|in)\b'''
secretGroup = 1
keywords = ["supabase.co", "supabase.in"]

[[rules.allowlists]]
description = "Synthetic stand-in project ref (exact value only)"
regexTarget = "secret"
regexes = ['''^abcdefghijklmnopqrst$''']

[[rules]]
id = "supabase-pooler-host"
description = "Concrete Supabase connection-pooler host"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.pooler\.supabase\.com\b'''
keywords = ["pooler.supabase.com"]

[[rules]]
id = "supabase-api-key"
description = "Supabase API key (sb_secret_ / sb_publishable_)"
regex = '''\bsb_(?:secret|publishable)_[A-Za-z0-9_-]{16,}'''
keywords = ["sb_secret_", "sb_publishable_"]
